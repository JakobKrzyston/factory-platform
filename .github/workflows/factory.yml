# The work queue (TL-6) and its chain of agents (TL-7). Adding `factory:ready` to an issue starts the triage
# agent; each agent that succeeds adds the label that starts the next: spec, implement, review. The issue's
# factory:* label is its state throughout. See platform/queue/README.md.
name: Factory
on:
  issues:
    types: [labeled, closed]
permissions:
  contents: read

jobs:
  run:
    # The labels that queue a role, copied by hand from STAGES in platform/queue/queue.ts: change both together.
    if: >-
      github.event.action == 'labeled'
      && contains(fromJSON('["factory:ready", "factory:spec", "factory:implement", "factory:review"]'), github.event.label.name)
    runs-on: ubuntu-latest
    # The secrets live in an environment that deploys from main only, so a workflow running a
    # factory branch's code cannot read them (#33).
    environment: factory
    # One run per issue at a time. A second run waits here, then finds the label gone and stops.
    concurrency:
      group: factory-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      STAGE: ${{ github.event.label.name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The run's row in the run log (platform/runlog/), named after this Actions run so the two join.
      RUN_LOG_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The factory acts as its own App, never as GITHUB_TOKEN: PRs that token opens run no CI (TL-10).
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # The role this label queues, and the state its success moves the issue to.
      - name: Read the stage
        id: stage
        run: |
          STAGE=${STAGE#factory:}
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          pnpm exec tsx platform/queue/queue.ts stage "$STAGE" >> "$GITHUB_OUTPUT"

      - name: Claim the issue
        id: claim
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STAGE: ${{ steps.stage.outputs.stage }}
        # Assigned first so a failed claim fails the step; inside echo's arguments it would not.
        run: |
          claimed=$(pnpm exec tsx platform/queue/queue.ts claim "$REPO" "$ISSUE" "$STAGE")
          echo "claimed=$claimed" >> "$GITHUB_OUTPUT"

      # After the claim, so a run that finds nothing to claim stops without installing anything, and a
      # runner that cannot be set up reaches the report step below instead of leaving the issue queued.
      - name: Prepare the runner
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Claude Code sandboxes Bash, and the gate sandboxes its checks, with bubblewrap on Linux
          # (srt also needs socat and ripgrep). Ubuntu's AppArmor default blocks the user namespaces
          # bubblewrap needs, and from 26.04 a bwrap profile also strips the nested one srt's seccomp
          # helper needs. Azure's resolver often times out on the Ubuntu mirrors' names, hence the
          # retries (#41).
          sudo apt-get update -q -o Acquire::Retries=5
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [[ -f /etc/apparmor.d/bwrap-userns-restrict ]]; then sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict; fi
          npm install -g @anthropic-ai/claude-code@2.1.322
          # run-issue.sh commits and pushes as the App (implement).
          gh auth setup-git
          git config --global user.name "$APP_SLUG[bot]"
          git config --global user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Run the agent
        id: agent
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGE: ${{ steps.stage.outputs.stage }}
          ROLE: ${{ steps.stage.outputs.role }}
          NEXT: ${{ steps.stage.outputs.next }}
        run: |
          code=0
          scripts/run-issue.sh "$ROLE" "$ISSUE_URL" > "$RUNNER_TEMP/out" || code=$?
          comment=$RUNNER_TEMP/comment.md
          # The comment goes up before the next label, so the triage note and the spec are on the issue
          # before the role that reads them starts.
          if [[ $code -eq 0 ]]; then
            case $ROLE in
              # Only the spec's comment may start with the spec marker, so the triage note gets a heading.
              triage)
                { echo "**Triage**"; echo; cat "$RUNNER_TEMP/out"; echo; echo "_The factory's triage agent. [Run log]($RUN_URL)_"; } > "$comment" ;;
              spec)
                { cat "$RUNNER_TEMP/out"; echo; echo "_The factory's spec agent. [Run log]($RUN_URL)_"; } > "$comment" ;;
              implement)
                echo "The implement agent opened $(cat "$RUNNER_TEMP/out"). [Run log]($RUN_URL)" > "$comment" ;;
              review)
                echo "The review agent commented on $(cat "$RUNNER_TEMP/out"). A human reviews and merges. [Run log]($RUN_URL)" > "$comment" ;;
            esac
            pnpm exec tsx platform/queue/queue.ts set "$REPO" "$ISSUE" "$NEXT" "$comment"
          elif [[ $code -eq 3 ]]; then
            {
              echo "The factory's $ROLE agent stopped to ask a question:"
              echo
              sed 's/^/> /' "$RUNNER_TEMP/out"
              echo
              echo "Answer in a comment here, then add \`factory:$STAGE\` again. [Run log]($RUN_URL)"
              # The reviewer judges the diff against the spec alone, so an answer that changes it needs a new spec.
              if [[ $ROLE == implement ]]; then
                echo
                echo "If your answer changes the spec, add \`factory:spec\` instead, so the spec, and the review against it, follow it."
              fi
            } > "$comment"
            pnpm exec tsx platform/queue/queue.ts set "$REPO" "$ISSUE" needs-human "$comment"
          else
            echo "The factory's $ROLE agent failed (exit $code). See the [run log]($RUN_URL), then add \`factory:$STAGE\` to try this step again." > "$comment"
            pnpm exec tsx platform/queue/queue.ts set "$REPO" "$ISSUE" needs-human "$comment"
          fi
          echo "reported=true" >> "$GITHUB_OUTPUT"
          # A question is a state, not a failure; anything else turns the Actions run red.
          [[ $code -eq 0 || $code -eq 3 ]]

      # A run that times out, is cancelled or breaks before reporting must not stay in-progress,
      # and a claim that failed partway may have left the labels half changed.
      - name: Report a run that stopped early
        if: >-
          always() && steps.agent.outputs.reported != 'true'
          && (steps.claim.outputs.claimed == 'true' || steps.claim.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "The factory run stopped before it could report ($JOB_STATUS). See the [run log]($RUN_URL), then add \`$STAGE\` to try this step again." > "$RUNNER_TEMP/comment.md"
          pnpm exec tsx platform/queue/queue.ts set "$REPO" "$ISSUE" needs-human "$RUNNER_TEMP/comment.md"

      # run-issue.sh ends its own row. This catches a script that was killed or cancelled first, and does
      # nothing to a row that has already ended. The runner is fresh, so the one directory under
      # .runlog/runs/ is this run's, and the row gets the tokens its transcript recorded.
      - name: End the run log row
        if: always() && steps.claim.outputs.claimed == 'true' && steps.agent.outcome != 'skipped'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx platform/runlog/runlog.ts finish "$RUN_LOG_ID" failed .runlog/runs/*/

      - uses: actions/upload-artifact@v7
        if: always() && steps.claim.outputs.claimed == 'true'
        with:
          name: run-issue-${{ github.event.issue.number }}-${{ steps.stage.outputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          # .runlog/ also holds runlog.db, the run log itself when DATABASE_URL is not set.
          path: .runlog/
          include-hidden-files: true
          if-no-files-found: ignore

  # The factory's PR says "Closes #N", so merging it closes the issue as completed. A human may merge before the
  # review agent has finished, or after it failed, so any factory state counts; `queue done` then moves the
  # issue to done only if the factory's PR is what merged, not when a human closed it without one.
  done:
    if: >-
      github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
      && contains(join(github.event.issue.labels.*.name, ' '), 'factory:')
    runs-on: ubuntu-latest
    environment: factory
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: pnpm exec tsx platform/queue/queue.ts done "${{ github.repository }}" "${{ github.event.issue.number }}"
      # Compares each merged factory PR's head with the commit its run handed off.
      - name: Record rework
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx platform/runlog/runlog.ts rework "${{ github.repository }}" "${{ github.event.issue.number }}"
