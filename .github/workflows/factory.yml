# The work queue (TL-6) and its chain of agents (TL-7). Which labels start which agents is each factory's
# triggers/ (TL-17): for the code factory, adding `factory:ready` to an issue starts triage, and each agent that
# succeeds adds the label that starts the next. The issue's factory:* label is its state throughout. See
# platform/queue/README.md.
name: Factory
on:
  issues:
    types: [labeled, closed]
permissions:
  contents: read

jobs:
  # Finds the factory trigger, if any, that the added label starts. Outside the run job's environment and
  # concurrency group, so the labels the App adds itself (in-progress, in-review, needs-human) start no agent
  # and never queue behind or displace a run.
  route:
    if: github.event.action == 'labeled' && startsWith(github.event.label.name, 'factory:')
    runs-on: ubuntu-latest
    outputs:
      factory: ${{ steps.route.outputs.factory }}
      trigger: ${{ steps.route.outputs.trigger }}
      agent: ${{ steps.route.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: route
        env:
          LABEL: ${{ github.event.label.name }}
        run: pnpm exec tsx platform/queue/queue.ts route "${{ github.repository }}" "$LABEL" >> "$GITHUB_OUTPUT"

  run:
    needs: route
    if: needs.route.outputs.agent != ''
    runs-on: ubuntu-latest
    # The secrets live in an environment that deploys from main only, so a workflow running a
    # factory branch's code cannot read them (#33).
    environment: factory
    # One run per issue at a time. A second run waits here, then finds the label gone and stops.
    concurrency:
      group: factory-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      # The label that started the run, e.g. factory:ready, and what it starts.
      LABEL: ${{ github.event.label.name }}
      FACTORY: ${{ needs.route.outputs.factory }}
      TRIGGER: ${{ needs.route.outputs.trigger }}
      AGENT: ${{ needs.route.outputs.agent }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The run's row in the run log (platform/runlog/), named after this Actions run so the two join.
      RUN_LOG_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The factory acts as its own App, never as GITHUB_TOKEN: PRs that token opens run no CI (TL-10).
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Claim the issue
        id: claim
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        # Assigned first so a failed claim fails the step; inside echo's arguments it would not.
        run: |
          claimed=$(pnpm exec tsx platform/queue/queue.ts claim "$REPO" "$ISSUE" "$LABEL")
          echo "claimed=$claimed" >> "$GITHUB_OUTPUT"

      # After the claim, so a run that finds nothing to claim stops without installing anything, and a
      # runner that cannot be set up reaches the report step below instead of leaving the issue queued.
      - name: Prepare the runner
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          # Claude Code sandboxes Bash, and the gate sandboxes its checks, with bubblewrap on Linux
          # (srt also needs socat and ripgrep). Ubuntu's AppArmor default blocks the user namespaces
          # bubblewrap needs, and from 26.04 a bwrap profile also strips the nested one srt's seccomp
          # helper needs. Azure's resolver often times out on the Ubuntu mirrors' names, hence the
          # retries (#41).
          sudo apt-get update -q -o Acquire::Retries=5
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [[ -f /etc/apparmor.d/bwrap-userns-restrict ]]; then sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict; fi
          npm install -g @anthropic-ai/claude-code@2.1.322
          # run-issue.sh commits and pushes as the App (implement).
          gh auth setup-git
          git config --global user.name "$APP_SLUG[bot]"
          git config --global user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Run the agent
        id: agent
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # report posts a comment, then moves the issue: on success to the trigger's next label, whose run reads that
        # comment; on a question (3), an incomplete PR description (4, TL-8) or a failure to needs-human.
        run: |
          code=0
          scripts/run-issue.sh "$AGENT" "$ISSUE_URL" > "$RUNNER_TEMP/out" || code=$?
          pnpm exec tsx platform/queue/queue.ts report "$REPO" "$ISSUE" "$FACTORY" "$TRIGGER" "$code" "$RUNNER_TEMP/out" "$RUN_URL"
          echo "reported=true" >> "$GITHUB_OUTPUT"
          # A question or an incomplete description is a state, not a failure; anything else turns the Actions run red.
          [[ $code -eq 0 || $code -eq 3 || $code -eq 4 ]]

      # A run that times out, is cancelled or breaks before reporting must not stay in-progress,
      # and a claim that failed partway may have left the labels half changed.
      - name: Report a run that stopped early
        if: >-
          always() && steps.agent.outputs.reported != 'true'
          && (steps.claim.outputs.claimed == 'true' || steps.claim.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "The factory run stopped before it could report ($JOB_STATUS). See the [run log]($RUN_URL), then add \`$LABEL\` to try this step again." > "$RUNNER_TEMP/comment.md"
          pnpm exec tsx platform/queue/queue.ts set "$REPO" "$ISSUE" factory:needs-human "$RUNNER_TEMP/comment.md"

      # run-issue.sh ends its own row. This catches a script that was killed or cancelled first, and does
      # nothing to a row that has already ended. The runner is fresh, so the one directory under
      # .runlog/runs/ is this run's, and the row gets the tokens its transcript recorded.
      - name: End the run log row
        if: always() && steps.claim.outputs.claimed == 'true' && steps.agent.outcome != 'skipped'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx platform/runlog/runlog.ts finish "$RUN_LOG_ID" failed .runlog/runs/*/

      - uses: actions/upload-artifact@v7
        if: always() && steps.claim.outputs.claimed == 'true'
        with:
          name: run-issue-${{ github.event.issue.number }}-${{ needs.route.outputs.agent }}-${{ github.run_id }}-${{ github.run_attempt }}
          # .runlog/ also holds runlog.db, the run log itself when DATABASE_URL is not set.
          path: .runlog/
          include-hidden-files: true
          if-no-files-found: ignore

  # The factory's PR says "Closes #N", so merging it closes the issue as completed. A human may merge before the
  # review agent has finished, after it failed, or once they have filled in a description TL-8 found incomplete
  # (needs-human), so any factory state counts; `queue done` then moves the issue to done only if the factory's
  # PR is what merged, not when a human closed it without one.
  done:
    if: >-
      github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
      && contains(join(github.event.issue.labels.*.name, ' '), 'factory:')
    runs-on: ubuntu-latest
    environment: factory
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: pnpm exec tsx platform/queue/queue.ts done "${{ github.repository }}" "${{ github.event.issue.number }}"
      # Compares each merged factory PR's head with the commit its run handed off.
      - name: Record rework
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec tsx platform/runlog/runlog.ts rework "${{ github.repository }}" "${{ github.event.issue.number }}"
