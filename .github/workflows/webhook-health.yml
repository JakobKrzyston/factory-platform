# The GitHub-to-Throughline webhook health check (TL-25). Daily, so a broken link shows up while
# GitHub can still redeliver what it missed (about three days). See platform/health/README.md.
name: Webhook health
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The Throughline App's key can read the webhook URL, bypass included, so it lives in an
    # environment that deploys from main only, apart from the factory's secrets.
    environment: throughline
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the webhook
        env:
          THROUGHLINE_APP_ID: ${{ vars.THROUGHLINE_APP_ID }}
          THROUGHLINE_APP_PRIVATE_KEY: ${{ secrets.THROUGHLINE_APP_PRIVATE_KEY }}
        run: |
          key=$RUNNER_TEMP/throughline-app.pem
          printf '%s\n' "$THROUGHLINE_APP_PRIVATE_KEY" > "$key"
          THROUGHLINE_APP_PRIVATE_KEY_PATH=$key pnpm check-webhook
